name: Firmware Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ARM toolchain
        run: |
          # Bound apt network waits and retry: GitHub runners occasionally
          # stall on the Ubuntu mirrors, which previously hung the job.
          APT_OPTS="-o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
                    -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60"
          sudo apt-get $APT_OPTS update
          sudo apt-get $APT_OPTS install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi

      - name: Cache STM32CubeF1 dependencies
        uses: actions/cache@v5
        with:
          path: |
            external/STM32CubeF1
            external/FreeRTOS-Kernel
          key: deps-${{ runner.os }}-stm32cubef1-freertos

      - name: Fetch dependencies (STM32CubeF1 + FreeRTOS)
        run: |
          bash scripts/get_dependencies.sh
          bash scripts/get_freertos.sh

      - name: Build firmware
        run: make -j"$(nproc)"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: stm32f103c8-firmware-${{ github.sha }}
          path: |
            build/stm32f103c8.elf
            build/stm32f103c8.hex
            build/stm32f103c8.bin
          if-no-files-found: error
